<style>
  * { 
    box-sizing: border-box; margin: 0; padding: 0; 
    font-family: 'Marhey', 'Caveat', cursive, system-ui, sans-serif; 
  }
  
  :root {
    --insta-grad: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    --neon-blue: #00d2ff;
    --card-bg: rgba(22, 14, 38, 0.88);
    --border-color: rgba(220, 39, 67, 0.35);
  }

  body {
    background-color: #08030f;
    color: #f8fafc; padding: 12px; min-height: 100vh; transition: direction 0.3s;
    position: relative; overflow-x: hidden;
  }

  /* طبقة الإضاءة التفاعلية المتموجة في الخلفية */
  .ambient-mesh {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    pointer-events: none; z-index: -1; overflow: hidden;
    opacity: 0.35; transition: opacity 0.8s ease;
  }
  
  body.is-audio-playing .ambient-mesh {
    opacity: 0.85;
  }

  .mesh-orb {
    position: absolute; border-radius: 50%; filter: blur(75px);
    will-change: transform, opacity; opacity: 0.6;
  }
  .orb-orange {
    width: 320px; height: 320px;
    background: radial-gradient(circle, #f09433 10%, #e6683c 60%, transparent 80%);
    top: -5%; left: 5%;
  }
  .orb-pink {
    width: 380px; height: 380px;
    background: radial-gradient(circle, #dc2743 15%, #cc2366 60%, transparent 80%);
    top: 25%; right: -10%;
  }
  .orb-purple {
    width: 420px; height: 420px;
    background: radial-gradient(circle, #bc1888 20%, #4c1a59 70%, transparent 85%);
    bottom: 5%; left: 15%;
  }
  .orb-violet {
    width: 280px; height: 280px;
    background: radial-gradient(circle, #ff2a85 10%, #8a2be2 60%, transparent 80%);
    bottom: 25%; right: 10%;
  }

  body.is-audio-playing .orb-orange { animation: orbWave1 7s ease-in-out infinite alternate; }
  body.is-audio-playing .orb-pink { animation: orbWave2 8.5s ease-in-out infinite alternate; }
  body.is-audio-playing .orb-purple { animation: orbWave3 10s ease-in-out infinite alternate; }
  body.is-audio-playing .orb-violet { animation: orbWave4 6.5s ease-in-out infinite alternate; }

  @keyframes orbWave1 {
    0% { transform: translate3d(0, 0, 0) scale(1); }
    50% { transform: translate3d(45px, 65px, 0) scale(1.3); }
    100% { transform: translate3d(-35px, 35px, 0) scale(0.9); }
  }
  @keyframes orbWave2 {
    0% { transform: translate3d(0, 0, 0) scale(1); }
    50% { transform: translate3d(-65px, -45px, 0) scale(1.35); }
    100% { transform: translate3d(35px, 55px, 0) scale(0.85); }
  }
  @keyframes orbWave3 {
    0% { transform: translate3d(0, 0, 0) scale(1); }
    50% { transform: translate3d(55px, -55px, 0) scale(1.25); }
    100% { transform: translate3d(-45px, -25px, 0) scale(0.9); }
  }
  @keyframes orbWave4 {
    0% { transform: translate3d(0, 0, 0) scale(1); }
    50% { transform: translate3d(-45px, 45px, 0) scale(1.4); }
    100% { transform: translate3d(25px, -45px, 0) scale(0.8); }
  }

  /* الكارت الشخصي العلوي */
  .profile-card {
    background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px;
    padding: 8px 12px; display: flex; align-items: center; justify-content: space-between;
    gap: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 16px rgba(220, 39, 67, 0.2);
    backdrop-filter: blur(16px); margin-bottom: 12px;
  }
  .user-info { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
  .radio-avatar {
    width: 32px; height: 32px; min-width: 32px; border-radius: 9px; background: var(--insta-grad);
    display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px rgba(220, 39, 67, 0.6); padding: 5px;
  }
  .radio-avatar svg { width: 100%; height: 100%; }
  
  .username {
    font-size: 0.92rem; font-weight: 700; color: #fff;
    display: flex; align-items: center; gap: 4px; direction: ltr;
    white-space: nowrap; flex-shrink: 0;
  }
  .badge-check {
    background: #38bdf8; color: #000; font-size: 0.55rem; border-radius: 50%;
    width: 14px; height: 14px; display: inline-flex; align-items: center; justify-content: center; font-weight: 900;
  }
  
  .actions-group { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .btn-social {
    width: 28px; height: 28px; border-radius: 8px; display: inline-flex; align-items: center;
    justify-content: center; text-decoration: none; color: #fff; transition: transform 0.2s;
    flex-shrink: 0;
  }
  .btn-social svg { width: 14px; height: 14px; fill: currentColor; }
  .btn-ig { background: var(--insta-grad); box-shadow: 0 3px 8px rgba(220, 39, 67, 0.35); }
  .btn-tt { background: #000; border: 1px solid rgba(255, 255, 255, 0.25); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35); }
  
  .btn-lang {
    display: inline-flex; align-items: center; gap: 3px; padding: 5px 9px; border-radius: 8px;
    font-size: 0.78rem; font-weight: 700; color: #fff; cursor: pointer; border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08); transition: 0.2s; white-space: nowrap; flex-shrink: 0;
  }
  .btn-social:active, .btn-lang:active { transform: scale(0.92); }

  /* شريط المحطة الحالية بالأعلى */
  .now-playing-banner {
    position: sticky; top: 8px; z-index: 99;
    background: rgba(26, 15, 42, 0.94); border: 1.5px solid rgba(240, 148, 51, 0.5);
    border-radius: 18px; padding: 10px 14px; margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7), 0 0 20px rgba(220, 39, 67, 0.35);
    backdrop-filter: blur(18px); transition: all 0.3s ease;
  }
  .now-playing-banner.is-active {
    border-color: #f09433;
    box-shadow: 0 8px 30px rgba(240, 148, 51, 0.4), 0 0 25px rgba(220, 39, 67, 0.5);
  }
  .np-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .np-status-row { display: flex; align-items: center; gap: 6px; }
  .np-badge {
    font-size: 0.68rem; font-weight: 700; color: #fff; background: var(--insta-grad);
    padding: 2px 8px; border-radius: 10px; display: inline-flex; align-items: center; gap: 4px;
  }
  .pulse-dot {
    width: 6px; height: 6px; border-radius: 50%; background: #fff; display: inline-block;
  }
  .is-active .pulse-dot {
    animation: pulse-dot 1.2s infinite ease-in-out;
  }
  @keyframes pulse-dot { 0% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.3); } 100% { opacity: 0.3; transform: scale(0.8); } }

  .np-title {
    font-size: 1.05rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .np-tag { font-size: 0.72rem; color: #f09433; font-weight: 600; }

  .np-master-btn {
    width: 44px; height: 44px; min-width: 44px; border-radius: 50%; border: none;
    background: var(--insta-grad); color: #fff; font-size: 1.35rem; display: flex;
    align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 4px 15px rgba(220, 39, 67, 0.6); transition: 0.2s;
  }
  .np-master-btn:active { transform: scale(0.9); }
  .np-master-btn.btn-disabled { opacity: 0.4; pointer-events: none; }

  /* التبويبات */
  .tab-input { display: none; }
  .tabs-nav { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; scrollbar-width: none; }
  .tabs-nav::-webkit-scrollbar { display: none; }
  .tab-label {
    background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.12); color: #cbd5e1;
    padding: 7px 13px; border-radius: 18px; font-size: 0.85rem; font-weight: 700; cursor: pointer; white-space: nowrap; transition: 0.25s;
  }

  #tab-fav:checked ~ .tabs-nav .lbl-fav,
  #tab-pop:checked ~ .tabs-nav .lbl-pop,
  #tab-hiphop:checked ~ .tabs-nav .lbl-hiphop,
  #tab-dance:checked ~ .tabs-nav .lbl-dance,
  #tab-rnb:checked ~ .tabs-nav .lbl-rnb,
  #tab-rock:checked ~ .tabs-nav .lbl-rock,
  #tab-country:checked ~ .tabs-nav .lbl-country,
  #tab-retro:checked ~ .tabs-nav .lbl-retro,
  #tab-chill:checked ~ .tabs-nav .lbl-chill {
    background: var(--insta-grad); color: #fff; font-weight: 700; border-color: transparent; box-shadow: 0 4px 14px rgba(220, 39, 67, 0.5);
  }

  #tab-fav:checked ~ .stations-grid .card:not(.is-fav) { display: none; }
  #tab-pop:checked ~ .stations-grid .card:not(.pop) { display: none; }
  #tab-hiphop:checked ~ .stations-grid .card:not(.hiphop) { display: none; }
  #tab-dance:checked ~ .stations-grid .card:not(.dance) { display: none; }
  #tab-rnb:checked ~ .stations-grid .card:not(.rnb) { display: none; }
  #tab-rock:checked ~ .stations-grid .card:not(.rock) { display: none; }
  #tab-country:checked ~ .stations-grid .card:not(.country) { display: none; }
  #tab-retro:checked ~ .stations-grid .card:not(.retro) { display: none; }
  #tab-chill:checked ~ .stations-grid .card:not(.chill) { display: none; }

  /* الكروت وتنسيق المشغل */
  .stations-grid { display: flex; flex-direction: column; gap: 11px; }
  .card {
    background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px;
    padding: 13px; display: flex; flex-direction: column; gap: 11px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(14px); transition: border-color 0.3s;
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .station-title { font-size: 1.02rem; font-weight: 700; color: #f8fafc; margin-bottom: 4px; direction: ltr; text-align: start;}
  
  html[dir="rtl"] .station-title { text-align: right; }
  html[dir="ltr"] .station-title { text-align: left; }

  .station-tag {
    font-size: 0.73rem; font-weight: 700; color: #ffb703; background: rgba(255, 183, 3, 0.12);
    border: 1px solid rgba(255, 183, 3, 0.3); padding: 2px 9px; border-radius: 14px; display: inline-block;
  }
  
  .fav-btn { background: none; border: none; font-size: 1.4rem; color: rgba(255,255,255,0.2); cursor: pointer; transition: 0.3s; line-height: 1; padding: 0 4px; }
  .fav-btn.active { color: #ffd700; text-shadow: 0 0 12px rgba(255, 215, 0, 0.6); transform: scale(1.15); }

  .custom-player {
    display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.45);
    padding: 7px 11px; border-radius: 30px; border: 1px solid rgba(220, 39, 67, 0.3);
    position: relative; overflow: hidden; transition: 0.3s;
  }
  .custom-player.playing { border-color: transparent; box-shadow: 0 0 12px rgba(240, 148, 51, 0.4), inset 0 0 15px rgba(188, 24, 136, 0.25); }
  .custom-player.playing::before {
    content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
    background: var(--insta-grad); z-index: -1; border-radius: 32px;
  }
  .play-btn {
    width: 36px; height: 36px; border-radius: 50%; border: none; background: #fff;
    color: #dc2743; font-size: 1.15rem; display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 1; transition: 0.2s;
  }
  .play-btn:active { transform: scale(0.9); }
  .playing .play-btn { background: var(--insta-grad); color: #fff; box-shadow: 0 0 12px rgba(220, 39, 67, 0.6); }

  .visualizer { flex-grow: 1; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; position: relative; overflow: hidden; z-index: 1;}
  .visualizer::after {
    content: ''; position: absolute; top: 0; left: -50%; height: 100%; width: 40%;
    background: var(--insta-grad); box-shadow: 0 0 10px #f09433; opacity: 0; transition: 0.3s;
  }
  .playing .visualizer::after { opacity: 1; animation: neon-wave 1.5s infinite linear; }
  @keyframes neon-wave { 0% { left: -50%; } 100% { left: 100%; } }

  .status-text { font-size: 0.74rem; font-weight: 700; color: #94a3b8; width: 105px; text-align: center; z-index: 1;}
  .playing .status-text { color: #f09433; text-shadow: 0 0 6px rgba(240, 148, 51, 0.5); }
  .buffering .status-text { color: #ffd700; }
  .repairing .status-text { 
    color: #ff9800; font-weight: 800;
    animation: pulseRepair 0.8s infinite alternate;
  }
  @keyframes pulseRepair {
    0% { opacity: 0.5; transform: scale(0.95); }
    100% { opacity: 1; transform: scale(1); }
  }
</style>
</head>

    { id: 'j12', tab: 'chill', title: '🇺🇸 Smooth Jazz USA', tagAr: 'جاز أمريكي استرخائي', tagEn: 'Smooth Jazz', urls: ['https://listen.181fm.com/181-jazzmix_128k.mp3', 'https://stream.radioparadise.com/mellow-128', 'https://listen.181fm.com/181-breeze_128k.mp3'] },
    { id: 'j13', tab: 'chill', title: '🇺🇸 The Breeze Easy Listening', tagAr: 'موسيقى خفيفة ولطيفة', tagEn: 'Easy Listening', urls: ['https://listen.181fm.com/181-breeze_128k.mp3', 'https://stream.radioparadise.com/mellow-128', 'https://listen.181fm.com/181-mellow_128k.mp3'] },
    { id: 'j14', tab: 'chill', title: '🇺🇸 Classical Guitar Relax', tagAr: 'جيتار كلاسيكي هادئ', tagEn: 'Acoustic Guitar', urls: ['https://listen.181fm.com/181-classicalmusic_128k.mp3', 'https://stream.radioparadise.com/mellow-128', 'https://listen.181fm.com/181-breeze_128k.mp3'] }
  ];

  let appLang = localStorage.getItem('appLang') || (navigator.language.startsWith('ar') ? 'ar' : 'en');
  const container = document.getElementById('stations-container');
  let savedFavs = JSON.parse(localStorage.getItem('mshailFavs')) || [];

  // المشغل المركزي الموحد
  const masterAudio = new Audio();
  masterAudio.preload = 'none';

  let currentActiveStation = null;
  let activeCardPlayerDiv = null;
  let currentUrlIndex = 0;
  let failoverTimer = null;
  let isSwitchingSafe = false;

  // بناء كروت المحطات الـ 74
  let htmlContent = '';
  stations.forEach(s => {
    const isFav = savedFavs.includes(s.id);
    htmlContent += `
      <div class="card ${s.tab} ${isFav ? 'is-fav' : ''}" id="card-${s.id}">
        <div class="card-top">
          <div>
            <div class="station-title">${s.title}</div>
            <div class="station-tag dynamic-tag" data-ar="${s.tagAr}" data-en="${s.tagEn}">${appLang === 'ar' ? s.tagAr : s.tagEn}</div>
          </div>
          <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(this, '${s.id}')">★</button>
        </div>
        
        <div class="custom-player" id="player-${s.id}">
          <button class="play-btn" onclick="handleStationPlay('${s.id}')">▶</button>
          <div class="visualizer"></div>
          <div class="status-text dynamic-status" data-state="statusStop">${uiDict[appLang].statusStop}</div>
        </div>
      </div>
    `;
  });
  container.innerHTML = htmlContent;
  applyLanguage(appLang);

  // إدارة مؤقت الصيانة (مهلة 3.5 ثانية فقط قبل الانتقال السلس)
  function clearFailoverTimer() {
    if (failoverTimer) {
      clearTimeout(failoverTimer);
      failoverTimer = null;
    }
  }

  function startFailoverTimer() {
    clearFailoverTimer();
    failoverTimer = setTimeout(() => {
      if (masterAudio.paused || masterAudio.readyState < 2) {
        repairOrSwitchStation();
      }
    }, 3500);
  }

  // أحداث الصوت
  masterAudio.addEventListener('loadstart', () => {
    if (activeCardPlayerDiv && !activeCardPlayerDiv.classList.contains('repairing')) {
      updatePlayerStatus(activeCardPlayerDiv, 'buffering', uiDict[appLang].statusLoad);
    }
  });

  masterAudio.addEventListener('playing', () => {
    clearFailoverTimer();
    isSwitchingSafe = false;
    document.body.classList.add('is-audio-playing');

    if (activeCardPlayerDiv) {
      updatePlayerStatus(activeCardPlayerDiv, 'playing', uiDict[appLang].statusLive);
      activeCardPlayerDiv.querySelector('.play-btn').innerHTML = '⏸';
      updateBannerUI(true);
    }
  });

  masterAudio.addEventListener('waiting', () => {
    if (activeCardPlayerDiv && !activeCardPlayerDiv.classList.contains('repairing')) {
      updatePlayerStatus(activeCardPlayerDiv, 'buffering', uiDict[appLang].statusLoad);
    }
    startFailoverTimer();
  });

  masterAudio.addEventListener('pause', () => {
    clearFailoverTimer();
    isSwitchingSafe = false;
    document.body.classList.remove('is-audio-playing');

    if (activeCardPlayerDiv) {
      activeCardPlayerDiv.classList.remove('playing', 'buffering', 'repairing');
      activeCardPlayerDiv.querySelector('.play-btn').innerHTML = '▶';
      activeCardPlayerDiv.querySelector('.status-text').innerText = uiDict[appLang].statusStop;
      updateBannerUI(false);
    }
  });

  masterAudio.addEventListener('error', () => {
    if (currentActiveStation) {
      setTimeout(repairOrSwitchStation, 200);
    }
  });

  function updatePlayerStatus(playerDiv, stateClass, text) {
    playerDiv.classList.remove('playing', 'buffering', 'repairing');
    if (stateClass) playerDiv.classList.add(stateClass);
    playerDiv.querySelector('.status-text').innerText = text;
  }

  // مهندس الصيانة الآلي المانع للتعليق
  function repairOrSwitchStation() {
    clearFailoverTimer();
    if (!currentActiveStation || !activeCardPlayerDiv || isSwitchingSafe) return;
    isSwitchingSafe = true;

    currentUrlIndex++;

    // إذا توفر رابط بديل آخر في نفس المحطة
    if (currentUrlIndex < currentActiveStation.urls.length) {
      updatePlayerStatus(activeCardPlayerDiv, 'repairing', uiDict[appLang].statusFixing);
      const npBadgeText = document.getElementById('np-badge-text');
      if (npBadgeText) npBadgeText.innerText = uiDict[appLang].statusFixing;

      const nextUrl = currentActiveStation.urls[currentUrlIndex];

      setTimeout(() => {
        try {
          masterAudio.pause();
          masterAudio.src = nextUrl;
          masterAudio.load();
          startFailoverTimer();

          const p = masterAudio.play();
          if (p !== undefined) {
            p.then(() => {
              isSwitchingSafe = false;
            }).catch(() => {
              isSwitchingSafe = false;
              setTimeout(repairOrSwitchStation, 300);
            });
          } else {
            isSwitchingSafe = false;
          }
        } catch (err) {
          isSwitchingSafe = false;
          setTimeout(repairOrSwitchStation, 300);
        }
      }, 100);
    } else {
      // استنفاد الروابط: الانتقال التلقائي الفوري لتشغيل المحطة التالية في نفس القسم بالكامل
      isSwitchingSafe = false;
      switchEntireStationToNextInGenre();
    }
  }

  // تغيير القناة بالكامل والانتقال إلى الإذاعة التالية في نفس القسم وتحديث الواجهة بالكامل
  function switchEntireStationToNextInGenre() {
    clearFailoverTimer();
    if (!currentActiveStation) return;

    const currentGenre = currentActiveStation.tab;
    const genreStations = stations.filter(s => s.tab === currentGenre);
    const currentIndex = genreStations.findIndex(s => s.id === currentActiveStation.id);

    let nextIndex = (currentIndex + 1) % genreStations.length;
    let nextStation = genreStations[nextIndex];

    // إطفاء كرت المحطة السابقة
    if (activeCardPlayerDiv) {
      activeCardPlayerDiv.classList.remove('playing', 'buffering', 'repairing');
      activeCardPlayerDiv.querySelector('.play-btn').innerHTML = '▶';
      activeCardPlayerDiv.querySelector('.status-text').innerText = uiDict[appLang].statusStop;
    }

    // تشغيل المحطة التالية بنعومة ودون تعليق
    setTimeout(() => {
      handleStationPlay(nextStation.id);
    }, 200);
  }

  function handleStationPlay(stationId) {
    const station = stations.find(s => s.id === stationId);
    if (!station) return;

    clearFailoverTimer();
    isSwitchingSafe = false;
    const playerDiv = document.getElementById(`player-${station.id}`);

    // إيقاف إذا تم الضغط على نفس المحطة أثناء عملها
    if (currentActiveStation && currentActiveStation.id === station.id) {
      if (!masterAudio.paused) {
        masterAudio.pause();
        return;
      }
    }

    // تنظيف الكرت السابق
    if (activeCardPlayerDiv && activeCardPlayerDiv !== playerDiv) {
      activeCardPlayerDiv.classList.remove('playing', 'buffering', 'repairing');
      activeCardPlayerDiv.querySelector('.play-btn').innerHTML = '▶';
      activeCardPlayerDiv.querySelector('.status-text').innerText = uiDict[appLang].statusStop;
    }

    currentActiveStation = station;
    activeCardPlayerDiv = playerDiv;
    currentUrlIndex = 0;

    updatePlayerStatus(playerDiv, 'buffering', uiDict[appLang].statusLoad);
    updateBannerUI(true);

    try {
      masterAudio.pause();
      masterAudio.src = station.urls[0];
      masterAudio.load();
      startFailoverTimer();

      const playPromise = masterAudio.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          setTimeout(repairOrSwitchStation, 300);
        });
      }
    } catch (e) {
      setTimeout(repairOrSwitchStation, 300);
    }
  }

  function toggleMasterPlay() {
    if (currentActiveStation) {
      if (!masterAudio.paused) {
        masterAudio.pause();
      } else {
        startFailoverTimer();
        masterAudio.play().catch(() => {
          setTimeout(repairOrSwitchStation, 300);
        });
      }
    }
  }

  function updateBannerUI(isPlaying) {
    const banner = document.getElementById('now-playing-banner');
    const masterBtn = document.getElementById('np-master-btn');
    const npTitle = document.getElementById('np-title');
    const npTag = document.getElementById('np-tag');
    const npBadgeText = document.getElementById('np-badge-text');

    masterBtn.classList.remove('btn-disabled');

    if (isPlaying && currentActiveStation) {
      banner.classList.add('is-active');
      npTitle.innerText = currentActiveStation.title;
      npTag.innerText = (appLang === 'ar' ? currentActiveStation.tagAr : currentActiveStation.tagEn);
      npBadgeText.innerText = uiDict[appLang].npPlaying;
      masterBtn.innerHTML = '⏸';
    } else {
      banner.classList.remove('is-active');
      npBadgeText.innerText = uiDict[appLang].npPaused;
      masterBtn.innerHTML = '▶';
    }
  }

  function toggleLanguage() {
    appLang = (appLang === 'ar') ? 'en' : 'ar';
    localStorage.setItem('appLang', appLang);
    applyLanguage(appLang);
  }

  function applyLanguage(lang) {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('ui-btn-lang').innerText = uiDict[lang].btnLang;

    document.getElementById('lbl-fav').innerText = uiDict[lang].tabFav;
    document.getElementById('lbl-pop').innerText = uiDict[lang].tabPop;
    document.getElementById('lbl-hiphop').innerText = uiDict[lang].tabHipHop;
    document.getElementById('lbl-dance').innerText = uiDict[lang].tabDance;
    document.getElementById('lbl-rnb').innerText = uiDict[lang].tabRnb;
    document.getElementById('lbl-rock').innerText = uiDict[lang].tabRock;
    document.getElementById('lbl-country').innerText = uiDict[lang].tabCountry;
    document.getElementById('lbl-retro').innerText = uiDict[lang].tabRetro;
    document.getElementById('lbl-chill').innerText = uiDict[lang].tabChill;

    if (!masterAudio || masterAudio.paused) {
      document.getElementById('np-title').innerText = uiDict[lang].npIdle;
      document.getElementById('np-tag').innerText = uiDict[lang].npIdleTag;
      document.getElementById('np-badge-text').innerText = uiDict[lang].statusStop;
    } else if (currentActiveStation) {
      document.getElementById('np-tag').innerText = (lang === 'ar' ? currentActiveStation.tagAr : currentActiveStation.tagEn);
      document.getElementById('np-badge-text').innerText = uiDict[lang].npPlaying;
    }

    document.querySelectorAll('.dynamic-tag').forEach(el => {
      el.innerText = el.getAttribute(`data-${lang}`);
    });
  }

  function toggleFav(btn, stationId) {
    const card = btn.closest('.card');
    if (savedFavs.includes(stationId)) {
      savedFavs = savedFavs.filter(id => id !== stationId);
      btn.classList.remove('active');
      card.classList.remove('is-fav');
    } else {
      savedFavs.push(stationId);
      btn.classList.add('active');
      card.classList.add('is-fav');
    }
    localStorage.setItem('mshailFavs', JSON.stringify(savedFavs));
  }
</script>
